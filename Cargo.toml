[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/aryanfredericks/snaprequest"
homepage = "https://github.com/aryanfredericks/snaprequest"
authors = ["Aryan Fredericks"]

[workspace.dependencies]
# Internal crates
snapreq-core = { path = "crates/snapreq-core", version = "0.1.0" }
snapreq-collection = { path = "crates/snapreq-collection", version = "0.1.0" }
snapreq-test = { path = "crates/snapreq-test", version = "0.1.0" }
snapreq-server = { path = "crates/snapreq-server", version = "0.1.0" }

# Shared external dependencies (add new ones here, then use `dep.workspace = true`)
anstream = "1"
anstyle = "1"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
brotli = "9"
brotli-decompressor = "6"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
insta = "1"
jsonschema = { version = "0.60", default-features = false, features = ["resolve-file"] }
md-5 = "0.11"
mime_guess = "2"
percent-encoding = "2"
rcgen = "0.14"
regex = "1"
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
ring = "0.17"
ruzstd = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
terminal_size = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
