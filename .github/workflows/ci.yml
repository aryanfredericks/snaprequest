name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  api-tests:
    name: API tests (examples/shop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the example collection and flow against the mock API
        run: scripts/api-tests.sh
        env:
          # The mock shop's demo password; real projects use a repository secret.
          SNAPREQ_SECRET_PASSWORD: letmein
      - name: Publish the JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/api-reports/*.xml
          check_name: API test report
      - name: Keep the HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: target/api-reports/

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: Licenses & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: snapreq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the server
        run: |
          docker run -d --name snapreq -p 127.0.0.1:7878:7878 snapreq:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7878/healthz && exit 0
            sleep 1
          done
          docker logs snapreq
          exit 1
      - name: Run the smoke test
        run: python3 scripts/docker-smoke.py http://127.0.0.1:7878
      - name: Server logs
        if: always()
        run: docker logs snapreq || true
