name: Nightly

# Platforms that are slow or scarce on GitHub's runners, kept out of the per-push CI (ci.yml).
# Runs every night and can be started by hand (Actions → Nightly → Run workflow).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
