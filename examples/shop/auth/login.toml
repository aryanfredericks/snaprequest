name = "Log in"
method = "POST"
url = "{{base_url}}/login"

[auth]
type = "none"

[body]
type = "json"
content = '{ "user": "{{user}}", "password": "{{password}}" }'

[capture]
token = { json = "$.token", secret = true }

[assert]
status = 200

[assert.json]
"$.token" = { type = "string", length = 17 }
"$.expires_in" = { gt = 0 }
