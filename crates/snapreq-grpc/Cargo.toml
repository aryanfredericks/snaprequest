[package]
name = "snapreq-grpc"
description = "SnapRequest gRPC: reflection, proto files and dynamic calls over the SnapRequest engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
snapreq-core.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util.workspace = true
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tonic = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false }
tower-service = "0.3"
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true, features = ["server", "http2"] }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }

[lints]
workspace = true
