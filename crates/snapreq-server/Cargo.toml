[package]
name = "snapreq-server"
description = "SnapRequest self-hosted server: REST/WebSocket API and storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
futures-util.workspace = true
snapreq-core.workspace = true
snapreq-collection.workspace = true
snapreq-test.workspace = true
snapreq-interop.workspace = true
snapreq-grpc.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
flate2.workspace = true
mime_guess.workspace = true
ring.workspace = true
rust-embed.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt", "signal", "time"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
tokio-tungstenite = "0.29"
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server"] }
# The mock gRPC server (crates/snapreq-grpc/examples/mock_grpc.rs).
prost-reflect = "0.16"
tonic = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
tower-service = "0.3"
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
